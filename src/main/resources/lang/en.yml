# LuxFeed - English messages.
# Messages use the MiniMessage format (for example <red>, <green>, <bold>).
# Any message removed from this file falls back to the default text bundled with the plugin.

command-description: "Restore your hunger and saturation."

feed:
  success: "<green>Your hunger and saturation have been fully restored."
  # <remaining> is replaced by the time left, built from the "time" entries below.
  cooldown: "<red>You must wait <remaining> before using /feed again."
  in-combat: "<red>You cannot use /feed while in combat."
  error: "<red>/feed is unavailable right now. Please try again later."

no-permission: "<red>You do not have permission to use this command."
players-only: "<red>Only players can use this command."

# <amount> is replaced by the number of hours, minutes or seconds.
time:
  hours: "<amount>h"
  minutes: "<amount>m"
  seconds: "<amount>s"
