name: LuxFeed
version: '${version}'
main: io.github.isynn.luxfeed.LuxFeedPlugin
api-version: '26.2'
description: Restores hunger and saturation with a permission-based cooldown.
author: ISynn

# The /feed command is registered in code through Paper's command API.
permissions:
  luxfeed.feed:
    description: Allows using /feed.
    default: true
  luxfeed.cooldown.default:
    description: Applies the 'default' /feed cooldown.
    default: true
  luxfeed.cooldown.vip:
    description: Applies the 'vip' /feed cooldown.
    default: false
  luxfeed.cooldown.premium:
    description: Applies the 'premium' /feed cooldown.
    default: false
  luxfeed.cooldown.staff:
    description: Applies the 'staff' /feed cooldown.
    default: false
  luxfeed.cooldown.bypass:
    description: Removes the /feed cooldown.
    default: op
